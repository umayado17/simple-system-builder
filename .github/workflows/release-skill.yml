name: Release skill

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be in x.y.z format: $VERSION_VALUE" >&2
            exit 1
          fi
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Validate and package skill
        run: python scripts/build_release.py --output dist/skill.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-${{ steps.version.outputs.version }}
          path: dist/skill.zip
          if-no-files-found: error

      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; publication will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/skill.zip \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG"
