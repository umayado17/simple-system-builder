name: Release skill

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release-bootstrap: v0.1.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and package skill
        run: python scripts/build_release.py --output dist/skill.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/skill.zip
          if-no-files-found: error

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/skill.zip \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"

      - name: Bootstrap v0.1.0 Release
        if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release-bootstrap: v0.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0" \
            dist/skill.zip \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --title "v0.1.0"
